<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación con Zod</title>
  <link rel="stylesheet" href="formularioZod.css">
  <script src="https://cdn.jsdelivr.net/npm/zod@3.21.4/lib/index.umd.min.js"></script>
</head>
<body>
  <h1>Registro de Usuario</h1>
  <form id="registerForm">
    <label for="name">Nombre:</label>
    <input type="text" id="name" placeholder="Tu nombre"/><br />

    <label for="email">Correo Electrónico:</label>
    <input type="email" id="email" placeholder="Tu correo"/><br />

    <label for="password">Contraseña:</label>
    <input type="password" id="password" placeholder="Contraseña"/><br />

    <button type="submit">Registrar</button>
  </form>

  <p id="errors"></p>

  <script>
    // Importamos Zod
    const { z } = window.Zod;

    //Limpiar los inputs
    document.querySelector("#name").textContent = "";
    document.querySelector("#email").textContent = "";
    document.querySelector("#password").textContent = "";

    // Esquema para validar los datos del formulario
    const registerSchema = z.object({
        name: z.string()
                .min(5, "El nombre debe de contener al menos 5 caracteres"),

        email: z.string()
                .trim()
                .email("Escribe un correo válido"),

        password: z.string()
                  .min(6, "Escribe una contraseña con al menos 6 caracteres")
    });

    document.getElementById("registerForm").addEventListener("submit", (event) => {
      event.preventDefault();
      
      // Capturamos los valores ingresados
      const formData = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
      };

      try {
        // PISTA: Usa el método correcto de Zod para validar el esquema.
        registerSchema.parse(formData);
        
        alert("¡Registro exitoso!");
        
      } catch (error) {
        // PISTA: Muestra los mensajes de error en la página.
        document.getElementById("errors").textContent = error.errors.map(e => e.message).join(", ");
        
      }
    });
  </script>
</body>
</html>
